<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>Cyber Runner Mini App</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDK de Anuncios -->
  <script src="//libtl.com/sdk.js" data-zone="11937368" data-sdk="show_11937368" async onError="window.adSdkFailed = true;"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');
    
    body { 
      touch-action: manipulation; 
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    canvas { display: block; }

    /* Glow effects */
    .glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7), 0 0 20px rgba(6, 182, 212, 0.4); }
    .glow-amber { text-shadow: 0 0 10px rgba(245, 158, 11, 0.7), 0 0 20px rgba(245, 158, 11, 0.4); }
    .box-glow-cyan { box-shadow: 0 0 25px rgba(6, 182, 212, 0.3), inset 0 0 15px rgba(6, 182, 212, 0.2); }
    
    /* Dynamic UI animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .animate-pulse-glow { animation: pulseGlow 2s infinite ease-in-out; }
  </style>
</head>
<body class="text-white overflow-hidden select-none flex justify-center items-center min-h-screen">

  <!-- Game Container -->
  <div class="relative w-full max-w-md h-screen max-h-[920px] bg-slate-950 flex flex-col justify-between overflow-hidden shadow-2xl border-x border-slate-800">

    <!-- HUD Superior -->
    <div class="absolute top-0 left-0 right-0 p-4 z-10 flex justify-between items-center bg-gradient-to-b from-slate-950/90 via-slate-950/50 to-transparent backdrop-blur-xs">
      <!-- Contador de Estrellas -->
      <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-amber-500/30 shadow-lg">
        <span class="text-xl animate-bounce">⭐</span>
        <span id="stars-count" class="font-orbitron font-bold text-amber-400 text-lg glow-amber">0</span>
      </div>

      <!-- Indicador Combo / Powerup -->
      <div id="powerup-badge" class="hidden px-3 py-1 rounded-full bg-cyan-500/20 border border-cyan-400/50 text-cyan-300 font-bold text-xs uppercase tracking-wider animate-pulse">
        Escudo Activo
      </div>

      <!-- Puntaje -->
      <div class="text-right bg-slate-900/80 px-4 py-1.5 rounded-2xl border border-cyan-500/30 shadow-lg">
        <div class="text-[10px] text-cyan-400 uppercase tracking-widest font-bold">SCORE</div>
        <div id="score-count" class="font-orbitron font-extrabold text-cyan-400 text-xl glow-cyan">0</div>
      </div>
    </div>

    <!-- Canvas Principal -->
    <canvas id="gameCanvas" class="w-full h-full"></canvas>

    <!-- UI OVERLAY: Pantalla Inicio / Game Over -->
    <div id="ui-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-between p-6 z-20 transition-all duration-300">
      
      <!-- Header / Logo -->
      <div class="mt-8 text-center">
        <div class="inline-block px-3 py-1 mb-2 bg-cyan-500/10 border border-cyan-500/30 rounded-full text-cyan-400 text-xs font-semibold uppercase tracking-widest">
          Telegram Mini App Edition
        </div>
        <h1 class="font-orbitron text-4xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-indigo-400 glow-cyan">
          CYBER RUNNER
        </h1>
        <p class="text-slate-400 text-xs mt-1">Desliza o toca los lados para esquivar los neones</p>
      </div>

      <!-- Mascot / Preview Graphic -->
      <div class="relative w-32 h-32 my-auto flex items-center justify-center">
        <div class="absolute inset-0 rounded-full bg-cyan-500/20 blur-xl animate-pulse"></div>
        <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-cyan-500 to-indigo-600 p-0.5 box-glow-cyan animate-pulse-glow">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
            <span class="text-5xl">⚡</span>
          </div>
        </div>
      </div>

      <!-- Acciones & Botones -->
      <div class="w-full space-y-3 mb-6">
        <button id="start-btn" onclick="startGame()" class="w-full py-4 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-orbitron font-bold text-lg rounded-2xl shadow-lg shadow-cyan-500/30 transform active:scale-95 transition-all tracking-wider border border-cyan-300/30">
          ▶ INICIAR CARRERA
        </button>

        <button onclick="showAdForBonus()" class="w-full py-3.5 bg-slate-900/90 border border-amber-500/40 text-amber-400 font-bold rounded-2xl hover:bg-slate-800 flex items-center justify-center gap-2 transform active:scale-95 transition-all shadow-md">
          <span class="text-xl">📺</span>
          <span>VER ANUNCIO (+25 ⭐)</span>
        </button>
      </div>

      <!-- Footer Info -->
      <div class="text-center text-[11px] text-slate-500">
        Recompensas respaldadas por Telegram Stars & Ads Network
      </div>
    </div>

  </div>

  <script>
    // Configuración de Telegram Mini App SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#030712');
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const container = canvas.parentElement;
      canvas.width = container.clientWidth || 360;
      canvas.height = container.clientHeight || 640;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Variables de Estado del Juego
    let isRunning = false;
    let score = 0;
    let stars = 0;
    let gameSpeed = 6;
    let roadOffset = 0;
    let shieldActive = false;

    // Configuración del Jugador
    let player = {
      lane: 1, // 0: Izquierda, 1: Centro, 2: Derecha
      x: 0,
      y: 0,
      targetX: 0,
      size: 28
    };

    let obstacles = [];
    let collectibles = [];
    let particles = [];

    // Función del Anuncio Recompensado (SDK libtl)
    function showAdForBonus() {
      if (typeof show_11937368 === 'function' && !window.adSdkFailed) {
        show_11937368().then(() => {
          stars += 25;
          document.getElementById('stars-count').innerText = stars;
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          alert('¡Genial! Has ganado +25 Estrellas ⭐');
        }).catch((err) => {
          console.error(err);
          alert('No se pudo cargar el anuncio. Inténtalo más tarde.');
        });
      } else {
        // Fallback si no hay conexión o bloqueador activo
        stars += 10;
        document.getElementById('stars-count').innerText = stars;
        alert('Anuncio no disponible. Te regalamos +10 Estrellas ⭐');
      }
    }

    function startGame() {
      document.getElementById('ui-overlay').classList.add('opacity-0', 'pointer-events-none');
      setTimeout(() => document.getElementById('ui-overlay').classList.add('hidden'), 300);
      
      isRunning = true;
      score = 0;
      gameSpeed = 6;
      obstacles = [];
      collectibles = [];
      particles = [];
      player.lane = 1;
      shieldActive = false;
      document.getElementById('powerup-badge').classList.add('hidden');
      
      gameLoop();
    }

    function gameOver() {
      isRunning = false;
      document.getElementById('start-btn').innerText = '🔄 REINTENTAR';
      document.getElementById('ui-overlay').classList.remove('hidden');
      setTimeout(() => document.getElementById('ui-overlay').classList.remove('opacity-0', 'pointer-events-none'), 10);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    // Controles por Toque
    canvas.addEventListener('pointerdown', (e) => {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      
      if (clickX < canvas.width / 2) {
        if (player.lane > 0) player.lane--;
      } else {
        if (player.lane < 2) player.lane++;
      }
      
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    });

    // Dibujar Fondo Cyberpunk y Carretera 3D
    function drawEnvironment() {
      // Cielo en degradado
      const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bgGrad.addColorStop(0, '#030712');
      bgGrad.addColorStop(0.5, '#0f172a');
      bgGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Pista Synthwave con Perspectiva
      const horizonY = canvas.height * 0.25;
      const laneWidthBottom = canvas.width * 0.38;
      const laneWidthTop = canvas.width * 0.12;
      const centerX = canvas.width / 2;

      // Dibujar Carriles
      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 10;

      for (let i = -1.5; i <= 1.5; i += 1) {
        const xTop = centerX + i * laneWidthTop;
        const xBottom = centerX + i * laneWidthBottom;

        ctx.beginPath();
        ctx.moveTo(xTop, horizonY);
        ctx.lineTo(xBottom, canvas.height);
        ctx.stroke();
      }

      // Líneas horizontales en movimiento (Efecto de velocidad)
      roadOffset = (roadOffset + gameSpeed) % 40;
      ctx.strokeStyle = 'rgba(147, 51, 234, 0.4)';
      ctx.lineWidth = 1.5;
      
      for (let y = horizonY; y < canvas.height; y += (y - horizonY * 0.8) * 0.15) {
        const lineY = y + (roadOffset * (y / canvas.height));
        if (lineY < canvas.height && lineY > horizonY) {
          ctx.beginPath();
          ctx.moveTo(0, lineY);
          ctx.lineTo(canvas.width, lineY);
          ctx.stroke();
        }
      }

      ctx.shadowBlur = 0; // Limpiar brillo
    }

    // Bucle Principal
    function gameLoop() {
      if (!isRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      drawEnvironment();

      // Calcular posición horizontal del jugador suavemente
      const laneWidthBottom = canvas.width * 0.32;
      const centerX = canvas.width / 2;
      player.targetX = centerX + (player.lane - 1) * laneWidthBottom;
      player.x += (player.targetX - player.x) * 0.25;
      player.y = canvas.height - 100;

      // Partículas de escape del personaje
      if (Math.random() < 0.6) {
        particles.push({
          x: player.x + (Math.random() * 10 - 5),
          y: player.y + 20,
          size: Math.random() * 4 + 2,
          speedY: Math.random() * 3 + 2,
          color: Math.random() > 0.5 ? '#06b6d4' : '#a855f7',
          alpha: 1
        });
      }

      // Renderizar Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.y += p.speedY;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Dibujar Jugador (Nave/Personaje Cyber)
      ctx.save();
      ctx.translate(player.x, player.y);

      // Brillo del jugador
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 15;

      // Escudo si está activo
      if (shieldActive) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, player.size + 10, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Cuerpo principal (Triángulo estilizado)
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.moveTo(0, -player.size);
      ctx.lineTo(player.size - 5, player.size);
      ctx.lineTo(0, player.size - 8);
      ctx.lineTo(-player.size + 5, player.size);
      ctx.closePath();
      ctx.fill();

      // Núcleo brillante
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // Generar Obstáculos y Coleccionables
      if (Math.random() < 0.035) {
        const lane = Math.floor(Math.random() * 3);
        const isStar = Math.random() < 0.35;

        if (isStar) {
          collectibles.push({ lane: lane, y: canvas.height * 0.25, size: 16 });
        } else {
          obstacles.push({ lane: lane, y: canvas.height * 0.25, size: 24 });
        }
      }

      // Renderizar Coleccionables (Estrellas)
      for (let i = collectibles.length - 1; i >= 0; i--) {
        let c = collectibles[i];
        c.y += gameSpeed;
        
        const cX = centerX + (c.lane - 1) * (laneWidthBottom * (c.y / canvas.height));
        
        ctx.fillStyle = '#f59e0b';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(cX, c.y, c.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Recolección
        const dist = Math.hypot(player.x - cX, player.y - c.y);
        if (dist < player.size + c.size) {
          collectibles.splice(i, 1);
          stars += 1;
          document.getElementById('stars-count').innerText = stars;
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        } else if (c.y > canvas.height + 30) {
          collectibles.splice(i, 1);
        }
      }

      // Renderizar Obstáculos (Bloques Neón)
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += gameSpeed;

        const obsX = centerX + (obs.lane - 1) * (laneWidthBottom * (obs.y / canvas.height));

        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 15;
        ctx.fillRect(obsX - obs.size, obs.y - obs.size, obs.size * 2, obs.size * 2);
        ctx.shadowBlur = 0;

        // Colisión
        const dist = Math.hypot(player.x - obsX, player.y - obs.y);
        if (dist < player.size + obs.size - 5) {
          if (shieldActive) {
            shieldActive = false;
            obstacles.splice(i, 1);
            document.getElementById('powerup-badge').classList.add('hidden');
          } else {
            gameOver();
            return;
          }
        } else if (obs.y > canvas.height + 40) {
          obstacles.splice(i, 1);
          score += 10;
          document.getElementById('score-count').innerText = score;
          
          // Incrementar velocidad gradualmente
          if (score % 100 === 0) gameSpeed += 0.5;
        }
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
