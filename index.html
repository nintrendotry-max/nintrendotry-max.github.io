<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>Cyber Runner Mini App</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SDK de Anuncios (Con respaldo para no bloquear el juego) -->
  <script src="//libtl.com/sdk.js" data-zone="11937368" data-sdk="show_11937368" async onError="window.adSdkFailed = true;"></script>

  <style>
    body { touch-action: manipulation; }
    canvas { display: block; }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-hidden select-none">

  <!-- HUD superior -->
  <div class="fixed top-0 left-0 right-0 p-4 flex justify-between items-center z-10 bg-slate-900/80 backdrop-blur-md border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <span class="text-xl">⭐</span>
      <span id="stars-count" class="font-bold text-yellow-400">0</span>
    </div>
    <div class="text-right">
      <div class="text-xs text-slate-400">Puntaje</div>
      <div id="score-count" class="font-bold text-cyan-400">0</div>
    </div>
  </div>

  <!-- Pantalla del Juego -->
  <div class="relative w-full h-screen flex items-center justify-center pt-14 pb-16">
    <canvas id="gameCanvas" class="w-full h-full max-w-md bg-slate-900 border border-slate-800 rounded-lg shadow-2xl"></canvas>
  </div>

  <!-- Botón de Inicio / Reinicio -->
  <div id="ui-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 z-20">
    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 mb-2">CYBER RUNNER</h1>
    <p class="text-slate-400 text-sm mb-6 text-center">Toca la pantalla o usa las flechas para moverte y esquivar obstáculos</p>
    
    <button id="start-btn" onclick="startGame()" class="w-full max-w-xs py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/30 transform active:scale-95 transition-all mb-3">
      ▶ ¡JUGAR AHORA!
    </button>

    <button onclick="showAdForBonus()" class="w-full max-w-xs py-3 bg-slate-800 border border-amber-500/50 text-amber-400 font-semibold rounded-xl hover:bg-slate-700 flex items-center justify-center gap-2">
      <span>📺 Ver Anuncio (+25 ⭐)</span>
    </button>
  </div>

  <script>
    // Inicializar Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Ajustar resolución del canvas
    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth || 360;
      canvas.height = canvas.parentElement.clientHeight || 600;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let isRunning = false;
    let score = 0;
    let stars = 0;
    let player = { x: canvas.width / 2, y: canvas.height - 80, size: 25, lane: 1 };
    let obstacles = [];

    // Función segura para anuncios
    function showAdForBonus() {
      if (typeof show_11937368 === 'function' && !window.adSdkFailed) {
        show_11937368().then(() => {
          stars += 25;
          document.getElementById('stars-count').innerText = stars;
          alert('¡Ganaste +25 Estrellas!');
        }).catch(() => {
          alert('No se pudo cargar el anuncio en este momento.');
        });
      } else {
        // Fallback si hay AdBlock
        stars += 10;
        document.getElementById('stars-count').innerText = stars;
        alert('Anuncios bloqueados o no disponibles. Te regalamos +10 Estrellas.');
      }
    }

    function startGame() {
      document.getElementById('ui-overlay').classList.add('hidden');
      isRunning = true;
      score = 0;
      obstacles = [];
      player.lane = 1;
      gameLoop();
    }

    function gameOver() {
      isRunning = false;
      document.getElementById('start-btn').innerText = '🔄 VOLVER A JUGAR';
      document.getElementById('ui-overlay').classList.remove('hidden');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

    // Controles táctiles/click (cambiar de carril)
    canvas.addEventListener('pointerdown', (e) => {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < canvas.width / 2) {
        if (player.lane > 0) player.lane--;
      } else {
        if (player.lane < 2) player.lane++;
      }
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    });

    // Bucle principal de juego
    function gameLoop() {
      if (!isRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Carriles
      const laneWidth = canvas.width / 3;
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2;
      for (let i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(i * laneWidth, 0);
        ctx.lineTo(i * laneWidth, canvas.height);
        ctx.stroke();
      }

      // Posicionar Jugador suavemente
      const targetX = (player.lane + 0.5) * laneWidth;
      player.x += (targetX - player.x) * 0.2;

      // Dibujar Jugador
      ctx.fillStyle = '#06b6d4';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
      ctx.fill();

      // Generar Obstáculos
      if (Math.random() < 0.03) {
        const lane = Math.floor(Math.random() * 3);
        obstacles.push({ x: (lane + 0.5) * laneWidth, y: -30, speed: 4 + score * 0.005 });
      }

      // Actualizar Obstáculos
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(obs.x - 18, obs.y - 18, 36, 36);

        // Colisión
        const dist = Math.hypot(player.x - obs.x, player.y - obs.y);
        if (dist < player.size + 18) {
          gameOver();
          return;
        }

        if (obs.y > canvas.height + 40) {
          obstacles.splice(i, 1);
          score += 10;
          document.getElementById('score-count').innerText = score;
        }
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
